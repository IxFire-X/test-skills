[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    contract: smoke между пакетами — счётчики, бюджеты ролей, форма вывода CLI, тексты (python -m pytest -m "contract and not native and not slow" -n 4)
    slow: тест набора contract дольше 30 с — идёт отдельным запуском (python -m pytest -m "contract and slow" -n 4) при правке схем или режима Б
    native: прогон настоящего pytest или Maven проекта (режим Б), в smoke не входит; пока ни один тест не помечен
