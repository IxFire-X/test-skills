name: Portable implementation gate

# Runs for pull requests and for pushes to main only: a push to a feature branch
# with an open pull request used to start the whole matrix twice.
# Human-readable documents that no check reads do not start a run. CONTRACTS.md,
# PIPELINE.md and skills/ are verified by ci_gate, so they are not ignored.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'QUICKSTART.md'
      - 'USAGE.md'
      - 'HOW-IT-WORKS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'QUICKSTART.md'
      - 'USAGE.md'
      - 'HOW-IT-WORKS.md'
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  implementation:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m tools.ci_gate --root .
      - run: python -m tools.doctor --root .
